{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b0c03">
  <title>{% block title %}IntoEat{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'intoeat/css/site.css' %}">
</head>
<body>
  <div class="page-shell">
    <header class="site-header" aria-label="Navegação principal">
      <a class="brand" href="{% url 'restaurantes:lista' %}" aria-label="IntoEat — restaurantes">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="14" fill="#f7f4ed"/><path d="M10 7v8m3-8v8m-6-8v8m3 0v10m10-18v18m0-18c4 1 5 6 0 9" stroke="#301507" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>IntoEat</span>
      </a>
      <nav class="header-nav" aria-label="Links rápidos">
        <a href="{% url 'restaurantes:lista' %}" title="Restaurantes" aria-label="Restaurantes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        </a>
        {% if user.is_authenticated %}
        <a href="{% url 'avaliacoes:minhas' %}" title="Meu perfil e avaliações" aria-label="Meu perfil e avaliações" {% block nav_profile_attr %}{% endblock %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
        </a>
        <a href="{% url 'restaurantes:meus' %}" title="Meus restaurantes" aria-label="Meus restaurantes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 21v-2a7 7 0 0 1 14 0v2"/><path d="M17 5a3.5 3.5 0 0 1 0 7m.5 3c2.4.7 4.5 2.2 4.5 6"/></svg>
        </a>
        {% endif %}
        {% if user.is_staff %}
        <a href="{% url 'admin:index' %}" title="Administração" aria-label="Administração">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 0 0-.2-1.8l1.5-1.2-2-3.5-1.8.7A8 8 0 0 0 14.4 4L14 2h-4l-.4 2a8 8 0 0 0-3.1 2.2l-1.8-.7-2 3.5 1.5 1.2A8 8 0 0 0 4 12c0 .6.1 1.2.2 1.8l-1.5 1.2 2 3.5 1.8-.7a8 8 0 0 0 3.1 2.2l.4 2h4l.4-2a8 8 0 0 0 3.1-2.2l1.8.7 2-3.5-1.5-1.2c.1-.6.2-1.2.2-1.8Z"/></svg>
        </a>
        {% endif %}
      </nav>
    </header>
    <main class="content-area" id="conteudo">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <span>Sobre o IntoEat</span>
      <span>Termos de Serviços</span>
      <span>Política de Privacidade</span>
    </footer>
  </div>
</body>
</html>
