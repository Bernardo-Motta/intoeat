<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{% block titulo %}Into Eat{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">Into Eat</a>
    {% if user.is_authenticated %}
      Olá, {{ user.nome_completo }}
      <form method="post" action="{% url 'usuarios:logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit">Sair</button>
      </form>
    {% else %}
      <a href="{% url 'usuarios:login' %}">Entrar</a>
      <a href="{% url 'usuarios:cadastro' %}">Cadastrar</a>
    {% endif %}
  </nav>
  <hr>
  {% block conteudo %}{% endblock %}
</body>
</html>
