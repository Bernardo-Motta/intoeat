<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Avaliar restaurante</title></head>
<body><main><h1>Avaliar {{ restaurante.nome }}</h1>
<form method="post">{% csrf_token %}
{{ form.non_field_errors }}

<button type="submit">Enviar avaliação</button></form></main></body></html>
